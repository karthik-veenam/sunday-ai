# Installed by `sunday-audio stackchan` and REMOVED by `sunday-audio airhug` (airhug == the original, pristine setup).
# 1. PATH = the unit's current default PATH with the shim dir in front. (Existing drop-ins audio.conf / telegram-owner.conf are untouched;
#    audio.conf's PULSE_SOURCE pin to the AIRHUG stays in place and is simply unused in stackchan mode.)
#    PATH starts with the shim dir: production's `arecord` / `aplay` calls reach the Stack-chan gateway instead of the AIRHUG.
# 2. Boot guard: if the Stack-chan backend is selected but not ready, boot on the AIRHUG instead of leaving Sunday deaf.
[Service]
Environment=SUNDAY_AUDIO_HOME=/home/djpi/sunday-audio
Environment="PATH=/home/djpi/sunday-audio/shim:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin"
ExecStartPre=-/home/djpi/sunday-audio/sunday-audio guard
