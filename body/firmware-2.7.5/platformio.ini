[platformio]
core_dir = /home/djpi/.sunday-pio

; Sunday face firmware for M5Stack StackChan (K151, CoreS3 / ESP32-S3)
; 16 MB quad flash, 8 MB quad PSRAM (per M5Stack K151 spec; verify at runtime in boot log)
[env:stackchan]
; BSP needs ESP-IDF 5.x (Arduino-ESP32 3.x); official espressif32 platform is stuck on 2.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = m5stack-cores3
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
extra_scripts = pre:tools/pio_pre.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    https://github.com/m5stack/StackChan-BSP.git
    crankyoldgit/IRremoteESP8266
    m5stack/M5Unit-NFC
    links2004/WebSockets@^2.7.0

; Wireless update (after the first cable flash of firmware >= 1.3):
;   SUNDAY_DIAG_TOKEN=<token from src/secrets.h> pio run -e stackchan_ota -t upload
[env:stackchan_ota]
extends = env:stackchan
upload_protocol = espota
upload_port = 192.168.88.17
upload_flags = --auth=${sysenv.SUNDAY_DIAG_TOKEN}
